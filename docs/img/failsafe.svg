<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Política fail-safe quando o Redis cai</title>
  <desc id="d">Com o Redis indisponível as regras que não dependem de cache continuam valendo. Valor igual ou acima de 5000 que seria aprovado vai para revisão; valor abaixo é aprovado; revisar e bloquear nunca são rebaixados.</desc>
  <rect width="960" height="330" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="30" y="40" font-size="16" font-weight="700" fill="#0f172a">Redis indisponível: o que acontece com a transação</text>

  <rect x="30" y="64" width="900" height="38" rx="8" fill="#e2e8f0"/>
  <g font-size="13" font-weight="700" fill="#0f172a">
    <text x="48" y="88">Situação</text>
    <text x="520" y="88">Resultado</text>
  </g>

  <g font-size="13" fill="#0f172a">
    <rect x="30" y="110" width="900" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="48" y="137">Regras que não dependem de cache (valor vs. média, horário)</text>
    <text x="520" y="137" font-weight="700">continuam valendo</text>

    <rect x="30" y="162" width="900" height="44" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="48" y="189">Valor ≥ 5000 e a decisão seria APROVAR</text>
    <text x="520" y="189" font-weight="700">vai para REVISAR</text>

    <rect x="30" y="214" width="900" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="48" y="241">Valor &lt; 5000</text>
    <text x="520" y="241" font-weight="700">APROVAR (não trava o cliente por falha nossa)</text>

    <rect x="30" y="266" width="900" height="44" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="48" y="293">Decisão já REVISAR ou BLOQUEAR</text>
    <text x="520" y="293" font-weight="700">nunca é rebaixada</text>
  </g>
</svg>
